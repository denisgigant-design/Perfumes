<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030405"><meta name="description" content="ATELIER — five fragrances displayed in a seamless, illuminated basalt showroom.">
<title>ATELIER | The Night Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Italiana&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="experience" id="experience">
 <div class="camera-viewport" id="viewport">
  <div class="world" id="world" aria-label="Five coloured fragrances illuminated in a rough basalt wall">
   <img id="background" class="wall-image" alt="Carved rough black-rock alcoves above a dark mirror-like reflective pool" src="scene-desktop.png">
   <img id="waterContinuation" class="water-continuation" src="water-continuation-desktop.png" alt="" aria-hidden="true">
   <div class="niche-colors" id="nicheColors" aria-hidden="true"></div>
   <canvas class="water-surface" id="waterSurface" aria-hidden="true"></canvas>
   <svg class="rock-edges" id="rockEdges" aria-hidden="true"></svg>
   <div class="bottle-fallbacks" id="fallbacks" aria-hidden="true"></div>
   <div class="three-layer" id="threeMount" aria-hidden="true"></div>
   <div class="hotspots" id="hotspots"></div>
  </div>
 </div>
 <header class="masthead">
   <button type="button" id="home" class="brand" aria-label="ATELIER — return to all fragrances"><strong>ATELIER</strong><span>PARFUM HOUSE</span></button>
   <span class="collection-title">THE NIGHT COLLECTION</span>
   <button type="button" class="basket-open" id="basketOpen">BASKET <span id="basketCount">0</span></button>
 </header>
 <div class="welcome" id="welcome"><p>WELCOME TO ATELIER</p><h1>The <em>night</em> collection.</h1><span>Five fragrances, unveiled in light.</span></div>
 <div class="caption" id="caption" aria-live="polite" aria-hidden="true">
   <div class="caption-text"><span id="stepNumber" class="step-label">01 / 05</span><h2 id="itemName">Ambre Doré</h2><p id="itemDesc"></p></div>
   <div class="purchase"><span class="price" id="price">€80</span><button type="button" id="addBasket">ADD TO BASKET <span>+</span></button></div>
 </div>
 <button id="back" class="back-control" type="button" aria-label="View all fragrances">↖ <span>ALL FRAGRANCES</span></button>
 <div class="scroll-hint" id="scrollHint">SCROLL TO DISCOVER <span aria-hidden="true">↓</span></div>
 <span class="position-status" id="positionStatus">01 — 05</span>
</div>
<div class="scroll-track" id="scrollTrack" aria-hidden="true"></div>
<div class="basket-overlay" id="basketOverlay" hidden>
 <div class="basket-shade" id="basketShade"></div>
 <aside class="basket-drawer" role="dialog" aria-modal="true" aria-label="Your basket">
 <div class="basket-heading"><span>YOUR BASKET</span><button type="button" id="basketClose" aria-label="Close basket">×</button></div>
 <div id="basketLines" class="basket-lines"></div>
 <div class="basket-total"><div><span>SUBTOTAL</span><strong id="basketTotal">€0</strong></div><p>This is a demonstration basket; payment processing is not connected.</p></div>
 </aside>
</div>
<script type="module" src="app.js"></script>
</body></html>
